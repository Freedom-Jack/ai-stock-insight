[project]
name = "stockinsight"
version = "0.2.0"
description = "Private, watchlist-scoped research workspace"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.120,<1",
    "uvicorn>=0.38,<1",
    "jinja2>=3.1.6,<4",
    "pywin32>=312; sys_platform == 'win32'",
    "tzdata>=2026.6",
]

[project.optional-dependencies]
fiscal = ["mcp>=1.28,<2"]

[dependency-groups]
browser-test = ["playwright>=1.50,<2"]

[tool.uv]
package = false
